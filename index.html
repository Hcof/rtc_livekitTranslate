<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трансляция экрана аккаунта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        #video-container { width: 100%; height: 75vh; background: #000; border-radius: 12px; overflow: hidden; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
        #screen-img { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .status { margin-top: 10px; font-size: 14px; color: #4ade80; }
    </style>
</head>
<body>
    <h2>📺 Live-трансляция экрана</h2>
    <div id="status" class="status">🟢 Трансляция активна</div>
    
    <div id="video-container">
        <img id="screen-img" alt="Загрузка трансляции..." />
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('account_id') || 'acc2'; 

        const imgElement = document.getElementById('screen-img');
        const NGROK_URL = "https://83a3-195-200-245-189.ngrok-free.app";

        async function refreshScreen() {
            try {
                const timestamp = new Date().getTime();
                const url = `${NGROK_URL}/api/screen/${accountId}?t=${timestamp}`;

                // Делаем запрос с заголовком, который вырубает заглушку ngrok
                const response = await fetch(url, {
                    headers: {
                        "ngrok-skip-browser-warning": "true"
                    }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    // Создаем временную ссылку на картинку и вешаем на тег
                    imgElement.src = URL.createObjectURL(blob);
                }
            } catch (err) {
                console.log("Ошибка загрузки кадра:", err);
            }
        }

        // Обновляем каждые 500 мс
        setInterval(refreshScreen, 500);
    </script>
</body>
</html>
