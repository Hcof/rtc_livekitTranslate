<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трансляция экрана аккаунта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем официальный клиентский LiveKit SDK через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        #video-container { width: 100%; height: 75vh; background: #000; border-radius: 12px; overflow: hidden; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .status { margin-top: 10px; font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <h2>📺 Live-трансляция экрана</h2>
    <div id="status" class="status">Подключение к облаку...</div>
    
    <div id="video-container">
        <!-- Сюда LiveKit автоматически воткнет тег <video> с потоком воркера -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('acc');
        const roomName = `room_${accountId}`;

        async function connectLiveKit() {
            try {
                document.getElementById('status').innerText = '🔄 Запрос то доступа...';
                
                // 1. Запрашиваем у твоего бэкенда токен для подключения зрителя (Viewer)
                let response = await fetch(`/api/get_livekit_token?acc=${accountId}`);
                let data = await response.json();
                
                document.getElementById('status').innerText = '🟢 Подключение к комнате...';

                // 2. Подключаемся к комнате LiveKit через WebSocket SDK
                const room = new LiveKit.Room();
                
                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LiveKit.Track.Kind.VIDEO) {
                        const element = track.attach();
                        document.getElementById('video-container').appendChild(element);
                        document.getElementById('status').innerText = '🟢 Трансляция активна (LiveKit Cloud)';
                    }
                });

                await room.connect(data.url, data.token);

            } catch (e) {
                document.getElementById('status').innerText = '❌ Ошибка: ' + e.message;
            }
        }

        connectLiveKit();
    </script>
</body>
</html>
